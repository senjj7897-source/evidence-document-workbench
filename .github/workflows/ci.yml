name: Verify release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install document dependencies
        run: python -m pip install -r requirements.txt

      - name: Run workbench tests
        run: npm test

      - name: Validate WorkBuddy skills
        run: npm run verify:workbuddy

      - name: Validate public-source boundary
        run: npm run verify:public
